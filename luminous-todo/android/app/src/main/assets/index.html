<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumina — Todo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <style>
      @font-face {
        font-family: Manrope;
        font-style: normal;
        font-weight: 400 700;
        src: url("fonts/Manrope.ttf") format("truetype");
      }

      @font-face {
        font-family: Syne;
        font-style: normal;
        font-weight: 600 800;
        src: url("fonts/Syne.ttf") format("truetype");
      }

      :root {
        --bg: #07080d;
        --ink: #f4efe6;
        --mute: rgba(244, 239, 230, 0.58);
        --line: rgba(244, 239, 230, 0.12);
        --glass: rgba(14, 16, 24, 0.62);
        --gold: #e8c07a;
        --teal: #7ee0c6;
        --violet: #9b8cff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Manrope, system-ui, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: 100dvh;
        isolation: isolate;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        z-index: -2;
      }

      .orb-a {
        width: 42vw;
        height: 42vw;
        top: -12%;
        left: -8%;
        background: radial-gradient(circle, rgba(155, 140, 255, 0.55), transparent 70%);
        animation: drift 18s ease-in-out infinite;
      }

      .orb-b {
        width: 38vw;
        height: 38vw;
        right: -10%;
        top: 18%;
        background: radial-gradient(circle, rgba(126, 224, 198, 0.42), transparent 70%);
        animation: drift 22s ease-in-out infinite reverse;
      }

      .orb-c {
        width: 30vw;
        height: 30vw;
        bottom: -8%;
        left: 28%;
        background: radial-gradient(circle, rgba(232, 192, 122, 0.38), transparent 70%);
        animation: pulse 12s ease-in-out infinite;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.18;
        background-image: radial-gradient(rgba(255, 255, 255, 0.18) 0.5px, transparent 0.5px);
        background-size: 3px 3px;
        pointer-events: none;
      }

      .shell {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: calc(36px + env(safe-area-inset-top, 0px)) 0 calc(80px + env(safe-area-inset-bottom, 0px));
      }

      .hero {
        margin-bottom: 28px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 11px;
        color: var(--mute);
      }

      .mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: conic-gradient(from 120deg, var(--gold), var(--teal), var(--violet), var(--gold));
        box-shadow: 0 0 18px rgba(232, 192, 122, 0.7);
      }

      .kicker {
        margin: 28px 0 8px;
        color: var(--mute);
        font-size: 14px;
      }

      h1 {
        margin: 0;
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: clamp(40px, 8vw, 72px);
        line-height: 0.95;
        letter-spacing: -0.04em;
        background: linear-gradient(120deg, #fff 10%, #e8c07a 48%, #7ee0c6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .panel {
        border: 1px solid var(--line);
        background: var(--glass);
        backdrop-filter: blur(28px);
        border-radius: 28px;
        padding: 22px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .meter {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }

      .meter svg {
        width: 44px;
        height: 44px;
        transform: rotate(-90deg);
      }

      .meter circle {
        fill: none;
        stroke-width: 4;
      }

      .meter .track {
        stroke: rgba(255, 255, 255, 0.1);
      }

      .meter .fill {
        stroke: #e8c07a;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.5s ease;
      }

      .meter strong {
        display: block;
        font-family: Syne, sans-serif;
        font-size: 22px;
      }

      .meter span {
        color: var(--mute);
        font-size: 13px;
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .composer input,
      .edit {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        border-radius: 16px;
        padding: 14px 16px;
        outline: none;
      }

      .composer input:focus,
      .edit:focus {
        border-color: rgba(232, 192, 122, 0.55);
        box-shadow: 0 0 0 4px rgba(232, 192, 122, 0.12);
      }

      .composer button,
      .filters button,
      .foot button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        cursor: pointer;
        color: #14110c;
        background: linear-gradient(180deg, #f3d59a, #d7a64d);
        font-weight: 700;
      }

      .composer button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .filters {
        display: flex;
        gap: 8px;
        margin: 16px 0 8px;
      }

      .filters button {
        background: rgba(255, 255, 255, 0.05);
        color: var(--mute);
        font-weight: 600;
      }

      .filters button.on {
        color: #14110c;
        background: linear-gradient(180deg, #c9fff0, #7ee0c6);
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 8px 0 0;
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 10px;
        padding: 10px 10px 10px 8px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        animation: rise 0.35s ease both;
      }

      .check {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .check span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: transparent;
        transform: scale(0.4);
        transition: 0.2s ease;
      }

      .row.done .check {
        border-color: var(--teal);
        box-shadow: 0 0 16px rgba(126, 224, 198, 0.35);
      }

      .row.done .check span {
        background: var(--teal);
        transform: scale(1);
      }

      .text {
        text-align: left;
        background: none;
        border: 0;
        color: inherit;
        cursor: text;
        padding: 6px 0;
      }

      .row.done .text {
        color: var(--mute);
        text-decoration: line-through;
      }

      .ghost {
        border: 0;
        background: transparent;
        color: var(--mute);
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .ghost:hover,
      .ghost:focus {
        color: var(--ink);
      }

      .danger:hover,
      .danger:focus {
        color: #ff9aa2;
      }

      .empty {
        padding: 42px 8px 28px;
        text-align: center;
        color: var(--mute);
      }

      .moon {
        width: 54px;
        height: 54px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #e8c07a 40%, transparent 42%),
          radial-gradient(circle at 70% 60%, #7ee0c6, transparent 46%);
        filter: drop-shadow(0 0 18px rgba(232, 192, 122, 0.4));
      }

      .foot {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }

      .foot button {
        background: transparent;
        color: var(--mute);
        font-weight: 600;
      }

      .store {
        margin: 14px 0 0;
        color: var(--mute);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .credit {
        margin: 10px 0 0;
        color: var(--gold);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .journal {
        margin-top: 18px;
        padding: 18px 20px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: rgba(14, 16, 24, 0.42);
      }

      .journal h2 {
        margin: 0 0 12px;
        font-family: Syne, sans-serif;
        font-size: 16px;
      }

      .journal ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .journal li {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 10px;
        font-size: 13px;
        color: var(--mute);
      }

      .journal strong {
        color: var(--gold);
        font-weight: 700;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(4%, 6%, 0) scale(1.08);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.12);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 640px) {
        .shell {
          padding-top: calc(36px + env(safe-area-inset-top, 0px));
        }
        .ghost:not(.danger) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grain"></div>

      <main class="shell">
        <header class="hero">
          <div class="brand">
            <span class="mark" aria-hidden="true"></span>
            <span>Lumina</span>
          </div>
          <p class="kicker" id="greeting">Good evening</p>
          <h1>Make space<br />for what remains.</h1>
          <p class="store">Saved on this device</p>
          <p class="credit">Created by Araf</p>
        </header>

        <section class="panel" aria-label="Todo list">
          <div class="meter">
            <svg viewBox="0 0 44 44" aria-hidden="true">
              <circle class="track" cx="22" cy="22" r="18"></circle>
              <circle class="fill" id="ring" cx="22" cy="22" r="18"></circle>
            </svg>
            <div>
              <strong id="progress">0%</strong>
              <span id="counts">0 left · 0 done</span>
            </div>
          </div>

          <form class="composer" id="composer">
            <input
              id="draft"
              type="text"
              placeholder="What deserves your attention?"
              maxlength="120"
              aria-label="New task"
              autocomplete="off"
            />
            <button type="submit" id="addBtn" disabled>Add</button>
          </form>

          <nav class="filters" aria-label="Filters">
            <button type="button" class="on" data-filter="all">All</button>
            <button type="button" data-filter="active">Open</button>
            <button type="button" data-filter="done">Done</button>
          </nav>

          <div id="listWrap"></div>
        </section>

        <aside class="journal" id="journal" hidden aria-label="Activity log">
          <h2>Every change, kept</h2>
          <ol id="events"></ol>
        </aside>
      </main>
    </div>

    <script>
      const KEY = "lumina.store.v1";
      const CIRC = 2 * Math.PI * 18;
      const LABELS = {
        created: "Added",
        completed: "Done",
        reopened: "Reopened",
        updated: "Edited",
        deleted: "Removed",
        cleared: "Cleared",
      };

      let todos = [];
      let events = [];
      let filter = "all";
      let editingId = null;
      let editDraft = "";

      function uid() {
        return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      }

      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            todos = Array.isArray(parsed.todos) ? parsed.todos : [];
            events = Array.isArray(parsed.events) ? parsed.events : [];
            return;
          }
        } catch (e) {}
        seed();
      }

      function save() {
        localStorage.setItem(KEY, JSON.stringify({ todos: todos, events: events }));
      }

      function logEvent(action, todoId, detail) {
        events.unshift({
          id: uid(),
          action: action,
          todoId: todoId || null,
          detail: detail || null,
          createdAt: Date.now(),
        });
        events = events.slice(0, 12);
      }

      function seed() {
        const now = Date.now();
        const rows = [
          ["Breathe. Then begin.", true, now - 3000],
          ["Write the thing that matters", false, now - 2000],
          ["Leave one kind note for tomorrow", false, now - 1000],
        ];
        todos = [];
        events = [];
        for (var i = 0; i < rows.length; i++) {
          var id = uid();
          todos.push({
            id: id,
            text: rows[i][0],
            done: rows[i][1],
            createdAt: rows[i][2],
            updatedAt: rows[i][2],
          });
          logEvent(rows[i][1] ? "completed" : "created", id, rows[i][0]);
        }
        save();
      }

      function greeting() {
        var hour = new Date().getHours();
        if (hour < 12) return "Good morning";
        if (hour < 18) return "Good afternoon";
        return "Good evening";
      }

      function visible() {
        if (filter === "active") return todos.filter(function (t) { return !t.done; });
        if (filter === "done") return todos.filter(function (t) { return t.done; });
        return todos;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function render() {
        document.getElementById("greeting").textContent = greeting();
        var remaining = todos.filter(function (t) { return !t.done; }).length;
        var completed = todos.filter(function (t) { return t.done; }).length;
        var total = todos.length;
        var progress = total === 0 ? 0 : Math.round((completed / total) * 100);
        document.getElementById("progress").textContent = progress + "%";
        document.getElementById("counts").textContent = remaining + " left · " + completed + " done";
        var ring = document.getElementById("ring");
        ring.setAttribute("stroke-dasharray", String(CIRC));
        ring.setAttribute("stroke-dashoffset", String(CIRC - (progress / 100) * CIRC));

        var wrap = document.getElementById("listWrap");
        var shown = visible();
        if (shown.length === 0) {
          wrap.innerHTML =
            '<div class="empty"><div class="moon"></div><p>' +
            (total === 0 ? "A quiet list. Start with one true thing." : "Nothing here in this view.") +
            "</p></div>";
        } else {
          var html = '<ul class="list">';
          for (var i = 0; i < shown.length; i++) {
            var todo = shown[i];
            html += '<li class="row' + (todo.done ? " done" : "") + '">';
            html +=
              '<button class="check" type="button" data-act="toggle" data-id="' +
              todo.id +
              '" aria-label="' +
              (todo.done ? "Mark as open" : "Mark as done") +
              '"><span></span></button>';
            if (editingId === todo.id) {
              html +=
                '<input class="edit" id="editInput" value="' +
                escapeHtml(editDraft) +
                '" aria-label="Edit task" />';
            } else {
              html +=
                '<button class="text" type="button" data-act="edit" data-id="' +
                todo.id +
                '">' +
                escapeHtml(todo.text) +
                "</button>";
            }
            html +=
              '<button class="ghost" type="button" data-act="edit" data-id="' +
              todo.id +
              '" aria-label="Edit">Edit</button>';
            html +=
              '<button class="ghost danger" type="button" data-act="remove" data-id="' +
              todo.id +
              '" aria-label="Delete">Del</button>';
            html += "</li>";
          }
          html += "</ul>";
          if (completed > 0) {
            html += '<footer class="foot"><button type="button" data-act="clear">Clear completed</button></footer>';
          }
          wrap.innerHTML = html;
          var editInput = document.getElementById("editInput");
          if (editInput) {
            editInput.focus();
            editInput.setSelectionRange(editInput.value.length, editInput.value.length);
            editInput.addEventListener("input", function () {
              editDraft = editInput.value;
            });
            editInput.addEventListener("keydown", function (e) {
              if (e.key === "Enter") saveEdit();
              if (e.key === "Escape") cancelEdit();
            });
            editInput.addEventListener("blur", function () {
              saveEdit();
            });
          }
        }

        var journal = document.getElementById("journal");
        var list = document.getElementById("events");
        if (events.length === 0) {
          journal.hidden = true;
          list.innerHTML = "";
        } else {
          journal.hidden = false;
          list.innerHTML = events
            .map(function (event) {
              return (
                "<li><strong>" +
                escapeHtml(LABELS[event.action] || event.action) +
                "</strong><span>" +
                escapeHtml(event.detail || "task") +
                "</span></li>"
              );
            })
            .join("");
        }
      }

      function add(text) {
        var now = Date.now();
        var todo = { id: uid(), text: text, done: false, createdAt: now, updatedAt: now };
        todos.unshift(todo);
        logEvent("created", todo.id, text);
        save();
        render();
      }

      function toggle(id) {
        var todo = todos.find(function (t) { return t.id === id; });
        if (!todo) return;
        todo.done = !todo.done;
        todo.updatedAt = Date.now();
        logEvent(todo.done ? "completed" : "reopened", todo.id, todo.text);
        save();
        render();
      }

      function remove(id) {
        var todo = todos.find(function (t) { return t.id === id; });
        if (!todo) return;
        if (editingId === id) cancelEdit(true);
        todos = todos.filter(function (t) { return t.id !== id; });
        logEvent("deleted", id, todo.text);
        save();
        render();
      }

      function startEdit(id) {
        var todo = todos.find(function (t) { return t.id === id; });
        if (!todo) return;
        editingId = id;
        editDraft = todo.text;
        render();
      }

      function cancelEdit(skipRender) {
        editingId = null;
        editDraft = "";
        if (!skipRender) render();
      }

      function saveEdit() {
        var id = editingId;
        var text = editDraft.trim();
        if (!id) return;
        editingId = null;
        editDraft = "";
        if (!text) {
          remove(id);
          return;
        }
        var todo = todos.find(function (t) { return t.id === id; });
        if (!todo) return;
        if (todo.text !== text) {
          todo.text = text;
          todo.updatedAt = Date.now();
          logEvent("updated", id, text);
          save();
        }
        render();
      }

      function clearDone() {
        var done = todos.filter(function (t) { return t.done; });
        if (!done.length) return;
        todos = todos.filter(function (t) { return !t.done; });
        for (var i = 0; i < done.length; i++) {
          logEvent("cleared", done[i].id, done[i].text);
        }
        save();
        render();
      }

      document.getElementById("composer").addEventListener("submit", function (e) {
        e.preventDefault();
        var input = document.getElementById("draft");
        var text = input.value.trim();
        if (!text) return;
        input.value = "";
        document.getElementById("addBtn").disabled = true;
        add(text);
      });

      document.getElementById("draft").addEventListener("input", function (e) {
        document.getElementById("addBtn").disabled = !e.target.value.trim();
      });

      document.querySelector(".filters").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-filter]");
        if (!btn) return;
        filter = btn.getAttribute("data-filter");
        var buttons = document.querySelectorAll(".filters button");
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].classList.toggle("on", buttons[i] === btn);
        }
        render();
      });

      document.getElementById("listWrap").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-act]");
        if (!btn) return;
        var act = btn.getAttribute("data-act");
        var id = btn.getAttribute("data-id");
        if (act === "toggle") toggle(id);
        if (act === "edit") startEdit(id);
        if (act === "remove") remove(id);
        if (act === "clear") clearDone();
      });

      document.getElementById("listWrap").addEventListener("dblclick", function (e) {
        var btn = e.target.closest("button.text[data-id]");
        if (!btn) return;
        startEdit(btn.getAttribute("data-id"));
      });

      load();
      render();
    </script>
  </body>
</html>
