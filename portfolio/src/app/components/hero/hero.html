<section class="hero" id="home">
  <div class="hero-orbs" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="container position-relative">
    <div class="row align-items-center g-5">
      <div class="col-lg-7">
        <p class="hero-kicker fade-up delay-1">Hi, I am Araf</p>
        <h1 class="hero-title fade-up delay-2">
          Full-Stack Software Developer building <span class="glow-text">bold</span> products.
        </h1>
        <p class="hero-copy fade-up delay-3">
          I craft pixel-perfect Angular interfaces and back them with Spring Boot APIs
          that stay fast, clean, and ready for real users.
        </p>
        <div class="hero-actions fade-up delay-4">
          <button class="btn btn-cta" type="button" (click)="scrollToWork()">
            View My Work
            <i class="bi bi-arrow-down-right"></i>
          </button>
          <a class="btn btn-ghost" href="#contact">Let's Talk</a>
        </div>
      </div>

      <div class="col-lg-5 d-flex justify-content-center">
        <div class="portrait fade-up delay-5">
          <div class="portrait-ring"></div>
          <img
            src="https://via.placeholder.com/480x480/1a0b2e/ffffff?text=Araf"
            alt="Araf portrait"
          />
        </div>
      </div>
    </div>
  </div>
</section>
