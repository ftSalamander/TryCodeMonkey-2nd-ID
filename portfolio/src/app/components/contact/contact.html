<section class="contact section" id="contact">
  <div class="container">
    <div class="row g-5 align-items-start">
      <div class="col-lg-5" appReveal>
        <p class="section-kicker">Contact</p>
        <h2 class="section-title">Want to work with me?</h2>
        <p class="contact-copy">
          I am Araf. Send a note and I will get back to you. This form is frontend-only for now.
        </p>
        <div class="socials">
          <a href="#" aria-label="GitHub"><i class="bi bi-github"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
          <a href="#" aria-label="Dribbble"><i class="bi bi-dribbble"></i></a>
          <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
        </div>
      </div>

      <div class="col-lg-7" appReveal>
        <form class="contact-form" (ngSubmit)="onSubmit()">
          <div class="float-field">
            <input id="name" name="name" type="text" [(ngModel)]="name" required placeholder=" " />
            <label for="name">Name</label>
          </div>
          <div class="float-field">
            <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder=" " />
            <label for="email">Email</label>
          </div>
          <div class="float-field">
            <textarea id="message" name="message" rows="5" [(ngModel)]="message" required placeholder=" "></textarea>
            <label for="message">Message</label>
          </div>
          <button class="btn btn-submit" type="submit">Send Message</button>
          @if (submitted) {
            <p class="thanks">Thanks — I have your message.</p>
          }
        </form>
      </div>
    </div>
  </div>
</section>
