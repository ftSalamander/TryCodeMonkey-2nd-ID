<section class="projects section" id="projects">
  <div class="container">
    <div class="section-head text-center" appReveal>
      <p class="section-kicker">Projects Showcase</p>
      <h2 class="section-title">Selected work I have shipped.</h2>
    </div>

    <div class="row g-4">
      @for (project of projects; track project.title) {
        <div class="col-md-6" appReveal>
          <article class="project-card">
            <div class="project-media">
              <img [src]="project.image" [alt]="project.title + ' thumbnail'" />
            </div>
            <div class="project-body">
              <h3>{{ project.title }}</h3>
              <p>{{ project.description }}</p>
              <div class="tag-row">
                @for (tag of project.tags; track tag) {
                  <span class="tag">{{ tag }}</span>
                }
              </div>
              <button class="btn btn-details" type="button">View Details</button>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
